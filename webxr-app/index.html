<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bateria acústica, Módulo 03</title>
    <style>
      body {
        margin: 0 auto;
        padding: 24px;
        max-width: 64rem;
        font-family: system-ui, sans-serif;
        font-size: 1.05rem;
        line-height: 1.5;
        color: #16161a;
        background: #fbfbfd;
      }
      h1 { font-size: 1.5rem; }
      h2 { font-size: 1.2rem; margin-top: 2rem; }
      h3 { font-size: 1.05rem; margin-top: 1.4rem; }
      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 8px;
        background: #15171c;
        margin: 12px 0;
      }
      button {
        font-size: 1.05rem;
        padding: 12px 20px;
        margin: 6px 6px 6px 0;
        border: 0;
        border-radius: 8px;
        background: #2f3a5c;
        color: #fff;
        cursor: pointer;
      }
      input { font-size: 1.05rem; padding: 10px; margin: 6px 6px 6px 0; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      pre {
        background: #f2f2f6;
        border: 1px solid #d5d5de;
        border-radius: 6px;
        padding: 10px 12px;
        white-space: pre-wrap;
      }
      table { border-collapse: collapse; width: 100%; margin: 8px 0; }
      th, td { border: 1px solid #c9c9d1; padding: 6px 8px; text-align: left; vertical-align: top; }
      th { background: #eceef4; }
      pre, td, .diario { overflow-wrap: anywhere; }
      input { max-width: 100%; box-sizing: border-box; }
      @media (max-width: 640px) {
        body { padding: 16px; }
        table, tbody, tr, td { display: block; width: 100%; box-sizing: border-box; }
        tr.cabecalho { display: none; }
        tr { border: 1px solid #c9c9d1; border-radius: 6px; margin: 10px 0; }
        td { border: 0; border-top: 1px solid #e3e3ea; }
        td:first-child { border-top: 0; font-weight: 600; }
        td::before { content: attr(data-coluna); display: block; font-size: 0.85rem; font-weight: 600; color: #4a4a58; }
      }
      .diario { margin: 4px 0; padding: 8px 10px; border-left: 4px solid #9a9ab0; }
      .diario-alerta { border-left-color: #b8860b; background: #fdf6e3; }
      .diario-falha { border-left-color: #a02c2c; background: #fdecec; }
    </style>
  </head>
  <body>
    <h1>Bateria acústica: a cena como árvore, a troca de pai e o custo do quadro</h1>

    <canvas id="cena"></canvas>
    <div>
      <button id="fixar" type="button">Fixar o bumbo na plataforma</button>
      <button id="girar" type="button">Girar a plataforma 30°</button>
      <button id="mover" type="button">Mover a plataforma 40 cm</button>
      <button id="redimensionar" type="button">Redimensionar a plataforma para 2,5 m</button>
      <button id="chimbal" type="button">Subir o chimbal para 90 cm</button>
      <button id="medir" type="button">Registrar a medição agora</button>
    </div>
    <p id="ultima-acao" class="diario">Clique num botão da demonstração: o resultado aparece aqui.</p>
    <div>
      <label for="rotulo">Informe um nome da máquina:</label>
      <input id="rotulo" type="text" placeholder="ex.: PC lab 3" />
      <button id="copiar" type="button" disabled>Copiar para a área de transferência</button>
      <button id="salvar" type="button" disabled>Salvar arquivo na máquina</button>
    </div>

    <h2>Diário</h2>
    <div id="diario"></div>

    <section id="estrutura"></section>
    <section id="medicao"></section>

    <h2>O que este aparelho oferece</h2>
    <button id="sondar" type="button">Sondar este aparelho</button>
    <section id="sonda"></section>
    <section id="relatorio"></section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
